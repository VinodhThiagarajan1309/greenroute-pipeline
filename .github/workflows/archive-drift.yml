name: OpenSpec Archive Drift

on:
  pull_request:
    paths:
      - "openspec/changes/**"
      - "openspec/specs/**"

jobs:
  archive-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python scripts/check_archive_drift.py
