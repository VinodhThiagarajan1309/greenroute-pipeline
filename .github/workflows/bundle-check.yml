name: Bundle Config Check

on:
  pull_request:
    paths:
      - "databricks.yml"
      - "resources/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check bundle config is structurally valid
        run: python scripts/check_bundle.py
