[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greenroute"
version = "0.1.0"
description = "GreenRoute lawn-care pipeline: bronze/silver/gold on Databricks."
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
