# Databricks Asset Bundle for the GreenRoute pipeline.
bundle:
  name: greenroute_pipeline

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://REPLACE-ME-dev.cloud.databricks.com
      root_path: /Shared/greenroute_pipeline/dev
    variables:
      catalog: greenroute_dev

  staging:
    mode: development
    workspace:
      host: https://REPLACE-ME-staging.cloud.databricks.com
      root_path: /Shared/greenroute_pipeline/staging
    variables:
      catalog: greenroute_staging

  prod:
    mode: production
    workspace:
      host: https://REPLACE-ME-prod.cloud.databricks.com
      root_path: /Shared/greenroute_pipeline/prod
    variables:
      catalog: greenroute_prod


bundle:
  name: greenroute-pipelines

include:
  - resources/*.yml


targets:
  dev:
    mode: development
    workspace:
      host: https://greenroute-dev.cloud.databricks.com
      root_path: /Shared/greenroute/dev
    variables:
      catalog: greenroute_dev

  staging:
    mode: production
    workspace:
      host: https://greenroute-staging.cloud.databricks.com
      root_path: /Shared/greenroute/staging
    variables:
      catalog: greenroute_staging

  prod:
    mode: production
    workspace:
      host: https://greenroute-prod.cloud.databricks.com
      root_path: /Shared/greenroute/prod
    variables:
      catalog: greenroute_prod
    permissions:
      - level: CAN_MANAGE
        group_name: data-platform-admins
# Each target pins its own workspace.host above. There is no bundle-level
# host anymore -- that was a single hardcoded workspace URL shared across
# targets, which meant a dev bundle deploy could silently point at staging.
